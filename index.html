<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲バナー画像ジェネレーター</title>

  <style>
    @font-face {
      font-family: 'MySaira';
      src: url('./Saira-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      font-family: 'MySaira', sans-serif;
    }
    body {
      background-color: #222;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .controls {
      display: grid;
      grid-template-columns: 110px 1fr;
      max-width: 420px;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    input[type="text"], select, button {
      padding: 8px 10px;
      font-size: 16px;
      border-radius: 4px;
      border: none;
      width: 100%;
    }
    .hidden {
      display: none !important;
    }

    .color-picker-box {
      background: #2c2c2c;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hex-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-preview {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      border: 2px solid #fff;
      flex-shrink: 0;
    }
    .hex-row input[type="text"] {
      font-size: 15px;
      padding: 6px 8px;
      text-transform: uppercase;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #bbb;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 7px;
      outline: none;
      margin: 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #222;
      cursor: pointer;
    }
    #hueSlider {
      background: linear-gradient(to right,
        #ff0000 0%, #ffff00 17%, #00ff00 33%,
        #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);
    }

    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
      grid-column: span 2;
      margin-top: 6px;
      padding: 10px;
    }
    canvas {
      border: 1px dashed #666;
      max-width: 100%;
      background-image: linear-gradient(45deg, #444 25%, transparent 25%),
                        linear-gradient(-45deg, #444 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #444 75%),
                        linear-gradient(-45deg, transparent 75%, #444 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
  </style>
</head>
<body>

  <h2>Saira バナー生成</h2>

  <div class="controls">
    <label>難易度</label>
    <select id="difficulty">
      <option value="EZ" data-color="#32b16c">EZ</option>
      <option value="HD" data-color="#00a0e9">HD</option>
      <option value="IN" data-color="#e60012" selected>IN</option>
      <option value="AT" data-color="#484b4e">AT</option>
      <option value="Custom" data-color="#9b59b6">Custom</option>
    </select>

    <label id="customDiffLabel" class="hidden">難易度名</label>
    <input type="text" id="customDiffInput" class="hidden" value="SP" placeholder="例: SP, EX">

    <label style="align-self: start; padding-top: 8px;">背景色</label>
    <div class="color-picker-box">
      <div class="hex-row">
        <div id="colorPreview" class="color-preview"></div>
        <input type="text" id="hexInput" value="#E60012" maxlength="7" placeholder="#RRGGBB">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span>色相 (Spectrum)</span><span id="hueVal">355°</span></div>
        <input type="range" id="hueSlider" min="0" max="360" value="355">

        <div class="slider-label"><span>彩度 (Saturation)</span><span id="satVal">100%</span></div>
        <input type="range" id="satSlider" min="0" max="100" value="100">

        <div class="slider-label"><span>明るさ (Lightness)</span><span id="litVal">45%</span></div>
        <input type="range" id="litSlider" min="0" max="100" value="45">
      </div>
    </div>

    <label>レベル数値</label>
    <input type="text" id="level" value="15">

    <label>曲名</label>
    <input type="text" id="title" value="曲名">

    <label>作曲者</label>
    <input type="text" id="composer" value="作曲者">

    <button id="downloadBtn">画像を保存 (PNG)</button>
  </div>

  <canvas id="canvas" width="900" height="220"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const elDiff = document.getElementById('difficulty');
    const elCustomLabel = document.getElementById('customDiffLabel');
    const elCustomInput = document.getElementById('customDiffInput');
    const elLevel = document.getElementById('level');
    const elTitle = document.getElementById('title');
    const elComposer = document.getElementById('composer');

    const elHex = document.getElementById('hexInput');
    const elPreview = document.getElementById('colorPreview');
    const elHue = document.getElementById('hueSlider');
    const elSat = document.getElementById('satSlider');
    const elLit = document.getElementById('litSlider');

    let currentBgColor = '#e60012';

    function hslToHex(h, s, l) {
      l /= 100;
      const a = s * Math.min(l, 1 - l) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return ('#' + f(0) + f(8) + f(4)).toUpperCase();
    }

    function hexToHsl(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };
    }

    function updateColorUI(fromHex = false) {
      if (fromHex) {
        const hsl = hexToHsl(currentBgColor);
        elHue.value = hsl.h;
        elSat.value = hsl.s;
        elLit.value = hsl.l;
      } else {
        currentBgColor = hslToHex(Number(elHue.value), Number(elSat.value), Number(elLit.value));
        elHex.value = currentBgColor;
      }

      const h = elHue.value;
      const s = elSat.value;
      const l = elLit.value;

      document.getElementById('hueVal').textContent = h + '°';
      document.getElementById('satVal').textContent = s + '%';
      document.getElementById('litVal').textContent = l + '%';

      elSat.style.background = 'linear-gradient(to right, hsl(' + h + ', 0%, ' + l + '%), hsl(' + h + ', 100%, ' + l + '%))';
      elLit.style.background = 'linear-gradient(to right, #000, hsl(' + h + ', ' + s + '%, 50%), #fff)';
      elPreview.style.backgroundColor = currentBgColor;
    }

    function drawParallelogram(topX, topY, width, height, skew) {
      ctx.beginPath();
      ctx.moveTo(topX, topY);
      ctx.lineTo(topX + width, topY);
      ctx.lineTo(topX + width - skew, topY + height);
      ctx.lineTo(topX - skew, topY + height);
      ctx.closePath();
    }

    function splitTextIntoLines(text, maxWidth) {
      const words = text.split(' ');
      let lines = [];
      let currentLine = '';

      for (const word of words) {
        const testLine = currentLine ? currentLine + ' ' + word : word;

        if (ctx.measureText(testLine).width <= maxWidth) {
          currentLine = testLine;
        } else {
          if (currentLine) {
            lines.push(currentLine);
            currentLine = word;
          } else {
            let temp = '';
            for (const char of word) {
              if (ctx.measureText(temp + char).width > maxWidth && temp) {
                lines.push(temp);
                temp = char;
              } else {
                temp += char;
              }
            }
            currentLine = temp;
          }
        }
      }
      if (currentLine) lines.push(currentLine);
      return lines;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#000000';
      ctx.fillRect(150, 35, 740, 150);

      ctx.fillStyle = '#ffffff';
      drawParallelogram(32, 35, 160, 150, 28);
      ctx.fill();

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 4;
      ctx.fillStyle = currentBgColor;
      drawParallelogram(52, 18, 126, 184, 34);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '72px "MySaira", sans-serif';
      ctx.fillText(elLevel.value, 98, 118);

      const diffText = (elDiff.value === 'Custom') ? elCustomInput.value : elDiff.value;
      ctx.font = '30px "MySaira", sans-serif';
      ctx.fillText(diffText, 98, 168, 105);

      ctx.textAlign = 'left';
      const maxWidth = 640;
      const titleText = elTitle.value;
      let composerY = 160;

      ctx.font = '48px "MySaira", sans-serif';
      if (ctx.measureText(titleText).width <= maxWidth) {
        ctx.fillText(titleText, 215, 110);
      } else {
        let fontSize = 32;
        let lines = [];
        while (fontSize >= 14) {
          ctx.font = fontSize + 'px "MySaira", sans-serif';
          lines = splitTextIntoLines(titleText, maxWidth);
          if (lines.length <= 2) break;
          fontSize -= 2;
        }
        if (lines.length > 2) {
          lines = [lines.at(0), lines.slice(1).join(' ')];
        }

        const lineHeight = fontSize + 6;
        ctx.fillText(lines.at(0), 215, 82);
        if (lines.at(1)) {
          ctx.fillText(lines.at(1), 215, 82 + lineHeight, maxWidth);
        }
        composerY = 168;
      }

      let compSize = 28;
      ctx.fillStyle = '#dddddd';
      ctx.font = compSize + 'px "MySaira", sans-serif';
      const compWidth = ctx.measureText(elComposer.value).width;
      if (compWidth > maxWidth) {
        compSize = Math.max(12, Math.floor(compSize * (maxWidth / compWidth)));
        ctx.font = compSize + 'px "MySaira", sans-serif';
      }
      ctx.fillText(elComposer.value, 218, composerY);
    }

    elDiff.addEventListener('change', () => {
      const isCustom = (elDiff.value === 'Custom');
      elCustomLabel.classList.toggle('hidden', !isCustom);
      elCustomInput.classList.toggle('hidden', !isCustom);

      currentBgColor = elDiff.options.item(elDiff.selectedIndex).dataset.color;
      elHex.value = currentBgColor;
      updateColorUI(true);
      draw();
    });

    [elHue, elSat, elLit].forEach(slider => {
      slider.addEventListener('input', () => {
        updateColorUI(false);
        draw();
      });
    });

    elHex.addEventListener('input', () => {
      let val = elHex.value.trim();
      if (!val.startsWith('#')) val = '#' + val;
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        currentBgColor = val.toUpperCase();
        updateColorUI(true);
        draw();
      }
    });

    [elCustomInput, elLevel, elTitle, elComposer].forEach(el => {
      el.addEventListener('input', draw);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'banner.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    updateColorUI(true);
    document.fonts.load('72px "MySaira"').then(draw);
    draw();
  </script>
</body>
</html>
